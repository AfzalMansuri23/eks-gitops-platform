      var count = len > 500 ? 3 : 2;
      for (var i = 0; i < count; i++) {
        var pk = svg("path", { class: "packet", d: "M-4,-4 L1,0 L-4,4" }, g);
        var am = svg("animateMotion", {
          dur: dur.toFixed(2) + "s", begin: (-(dur / count) * i).toFixed(2) + "s",
          repeatCount: "indefinite", rotate: "auto"
        }, pk);
        svg("mpath", { href: "#arch-edge-" + e.id }, am);
      }
      edgeEls[e.id] = g;
    });

    var nodeEls = {};
    cfg.nodes.forEach(function (n) {
      var g = svg("g", {
        class: "node", transform: "translate(" + n.x + "," + n.y + ")", tabindex: "0", role: "button",
        "aria-label": n.title + ", " + n.subtitle + ". Show details", style: "--c:var(--flow-" + n.flow + ")"
      }, gNodes);
      svg("rect", { class: "node-box", width: NODE_W, height: NODE_H, rx: 10 }, g);
      svg("rect", { class: "node-tag", x: 10, y: 15, width: 38, height: 30, rx: 7 }, g);
      var tag = svg("text", { class: "node-tag-text", x: 29, y: 34.5, "text-anchor": "middle" }, g);
      tag.textContent = n.tag;
      var title = svg("text", { class: "node-title", x: 58, y: 27 }, g);
      title.textContent = n.title;
      var sub = svg("text", { class: "node-sub", x: 58, y: 45 }, g);
      sub.textContent = n.subtitle;
      nodeEls[n.id] = g;
      g.addEventListener("mouseenter", function () { hover(n.id); });
      g.addEventListener("mouseleave", function () { hover(null); });
      g.addEventListener("focus", function () { hover(n.id); });
      g.addEventListener("blur", function () { hover(null); });
      g.addEventListener("click", function () { showNode(n.id); });
      g.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          showNode(n.id);
        }
      });
    });

    // keep long subtitles inside the card
    requestAnimationFrame(function () {
      s.querySelectorAll(".node-sub, .node-title").forEach(function (t) {
        var max = NODE_W - 66;
        if (t.getComputedTextLength && t.getComputedTextLength() > max) {
          t.setAttribute("textLength", max);
          t.setAttribute("lengthAdjust", "spacingAndGlyphs");
        }
      });
    });

    // ---- state
    var state = { flow: null, step: 0, playing: !reduced, hover: null, timer: null };

    function flowsOfNode(id) {
      var out = [nodes[id].flow];
      cfg.edges.forEach(function (e) {
        if ((e.from === id || e.to === id) && out.indexOf(e.flow) < 0) out.push(e.flow);
      });
      return out;
    }

    function paint() {
      var onE = {}, onN = {}, active = {}, lit = {};
      var focus = state.hover || state.flow;
      if (state.hover) {
        onN[state.hover] = true;
        cfg.edges.forEach(function (e) {
          if (e.from === state.hover || e.to === state.hover) {
            onE[e.id] = true;
            onN[e.from] = onN[e.to] = true;
          }
        });
      } else if (state.flow) {
        cfg.edges.forEach(function (e) {
          if (e.flow === state.flow) {
            onE[e.id] = true;
            onN[e.from] = onN[e.to] = true;
          }
        });
        var step = flows[state.flow].steps[state.step];
        step.edges.forEach(function (id) {
          active[id] = true;
          lit[edges[id].to] = true;
        });
      }
      s.classList.toggle("has-focus", !!focus);
      for (var id in edgeEls) {
        edgeEls[id].classList.toggle("on", !!onE[id]);
        edgeEls[id].classList.toggle("active", !!active[id] && !state.hover);
      }
      for (var nid in nodeEls) {
        nodeEls[nid].classList.toggle("on", !!onN[nid]);
        nodeEls[nid].classList.toggle("lit", !!lit[nid] && !state.hover);
      }
    }

    function hover(id) {
      state.hover = id;
      paint();
    }

    // ---- flow chips
    function chip(label, flowId) {
      var b = html("button", "arch-chip", chips, null);
      b.type = "button";
      if (flowId) {
        b.style.setProperty("--c", "var(--flow-" + flowId + ")");
        html("span", "arch-dot", b);
      }
      b.appendChild(document.createTextNode(label));
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { selectFlow(flowId); });
      b.dataset.flow = flowId || "";
      return b;
    }
    chip("All flows", null);
    cfg.flows.forEach(function (f) { chip(f.name, f.id); });

    function selectFlow(id) {
      state.flow = id;
      state.step = 0;
      chips.querySelectorAll(".arch-chip").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.flow === (id || "")));
      });
      renderSteps();
      paint();
      schedule();
    }

    function schedule() {
      clearInterval(state.timer);
      if (state.flow && state.playing) {
        state.timer = setInterval(function () {
          var steps = flows[state.flow].steps;
          state.step = (state.step + 1) % steps.length;
          renderSteps();
          paint();
        }, STEP_MS);
      }
    }

    function renderSteps() {
      stepsPanel.textContent = "";
      if (!state.flow) {
        html("h2", "arch-panel-title", stepsPanel, "Flows");
        html("p", "arch-muted", stepsPanel, "Pick a flow to play it hop by hop. Hover a component to see what it talks to.");
        var list = html("ul", "arch-legend", stepsPanel);
        cfg.flows.forEach(function (f) {
          var li = html("li", null, list);
          var b = html("button", "arch-legend-btn", li);
          b.type = "button";
          b.style.setProperty("--c", "var(--flow-" + f.id + ")");
          html("span", "arch-dot", b);
          b.appendChild(document.createTextNode(f.name + " · " + f.steps.length + " steps"));
          b.addEventListener("click", function () { selectFlow(f.id); });
        });
        return;
      }
      var f = flows[state.flow];
      var head = html("div", "arch-steps-head", stepsPanel);
      var h = html("h2", "arch-panel-title", head, f.name);
      h.style.setProperty("--c", "var(--flow-" + f.id + ")");
      var toggle = html("button", "arch-play", head, state.playing ? "Pause" : "Play");
      toggle.type = "button";
      toggle.setAttribute("aria-label", state.playing ? "Pause the walkthrough" : "Play the walkthrough");
      toggle.addEventListener("click", function () {
        state.playing = !state.playing;
        renderSteps();
        schedule();
        stepsPanel.querySelector(".arch-play").focus();
      });
      var ol = html("ol", "arch-step-list", stepsPanel);
      ol.style.setProperty("--c", "var(--flow-" + f.id + ")");
      f.steps.forEach(function (st, i) {
        var li = html("li", null, ol);
        var b = html("button", "arch-step" + (i === state.step ? " is-current" : ""), li);
        b.type = "button";
        if (i === state.step) b.setAttribute("aria-current", "step");
        html("span", "arch-step-n", b, String(i + 1));
        html("span", "arch-step-text", b, st.text);
        b.addEventListener("click", function () {
          state.step = i;
          renderSteps();
          paint();
          schedule();
          stepsPanel.querySelectorAll(".arch-step")[i].focus();
        });
      });
    }

    function showNode(id) {
      var n = nodes[id];
      detailPanel.textContent = "";
      var head = html("div", "arch-detail-head", detailPanel);
      var tag = html("span", "arch-tag", head, n.tag);
      tag.style.setProperty("--c", "var(--flow-" + n.flow + ")");
      var titles = html("div", null, head);
      html("h2", "arch-panel-title", titles, n.title);
      html("p", "arch-mono arch-muted", titles, n.subtitle);
      html("p", "arch-desc", detailPanel, n.description);
      var facts = html("ul", "arch-facts", detailPanel);
      n.facts.forEach(function (f) { html("li", null, facts, f); });
      var fl = html("div", "arch-node-flows", detailPanel);
      html("span", "arch-muted", fl, "Flows: ");
      flowsOfNode(id).forEach(function (fid) {
        var b = html("button", "arch-chip arch-chip-sm", fl);
        b.type = "button";
        b.style.setProperty("--c", "var(--flow-" + fid + ")");
        html("span", "arch-dot", b);
        b.appendChild(document.createTextNode(flows[fid].name));
        b.addEventListener("click", function () { selectFlow(fid); });
      });
      var a = html("a", "arch-source", detailPanel);
      a.href = cfg.repo + n.source;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = n.source;
      html("span", "arch-muted", a, "  view source");
    }

    function emptyDetail() {
      detailPanel.textContent = "";
      html("h2", "arch-panel-title", detailPanel, "Details");
      html("p", "arch-muted", detailPanel, "Click or press Enter on a component to see what it does, its key settings, and the file that defines it.");
    }

    emptyDetail();
    selectFlow(null);
  }

  window.ArchDiagram = { mount: mount };
})();

"dark":"#f2a649","light":"#9a5a08"},"steps":[{"edges":["r1"],"text":"The browser reaches ingress-nginx through port-forward 8080 with Host gitops-prod.localhost."},{"edges":["r2"],"text":"The Ingress rule sends the request to the webapp Service in gitops-prod, which picks one of 3 pods."},{"edges":["r3"],"text":"For ExitZero, the browser posts the pasted error to /ask on port 8001."},{"edges":["r4"],"text":"ExitZero ranks runbook entries with keyword and embedding search and returns the best match."}]},{"id":"creds","name":"Credentials","color":{"dark":"#e8749f","light":"#a32f63"},"steps":[{"edges":["c1"],"text":"On main, ci and helm trade their GitHub OIDC token for the github-actions-terraform role. The credentials last for one job."},{"edges":["c2"],"text":"On pull requests, terraform-plan gets the github-actions-plan role, which is read-only."},{"edges":["c3","c4"],"text":"In the cluster, ECK creates the Elasticsearch credentials and hands them to Filebeat and Kibana. Nobody writes a Secret by hand."}]},{"id":"metrics","name":"Metrics & alerts","color":{"dark":"#a594f5","light":"#5a43b5"},"steps":[{"edges":["m1"],"text":"Prometheus finds the API through its ServiceMonitor, scrapes /metrics every 15s and evaluates 4 alert rules."},{"edges":["m2"],"text":"Grafana queries Prometheus. The API dashboard is a ConfigMap the sidecar loads by label."}]},{"id":"logs","name":"Logs","color":{"dark":"#6ccb7d","light":"#2a7a3a"},"steps":[{"edges":["l1"],"text":"The API writes one JSON line per event to stdout. Filebeat tails the container log files on the node."},{"edges":["l2"],"text":"Filebeat keeps only the api namespace, decodes each line into fields and ships it to Elasticsearch."},{"edges":["l3"],"text":"Kibana searches the stored logs by level, logger, pod or message."}]},{"id":"infra","name":"Infra provisioning","color":{"dark":"#a3b4b7","light":"#4c6063"},"steps":[{"edges":["i1"],"text":"A pull request that touches infra/terraform runs terraform-plan."},{"edges":["i2"],"text":"The plan reads state from S3 without taking the lock, so it never blocks an apply."},{"edges":["i3"],"text":"An engineer applies the network stack from a laptop: VPC, subnets, internet gateway and NAT."},{"edges":["i4"],"text":"The eks stack reads the private subnet IDs from network state and creates the cluster there. It is destroyed after each session."}]}],"nodes":[{"id":"dev","title":"Engineer","subtitle":"kubectl, terraform","tag":"DEV","flow":"build","x":40,"y":110,"description":"Pushes code, applies the AWS stacks with Terraform, and reaches the local cluster with kubectl port-forward.","facts":["git push to main","terraform apply","kubectl --context kind-lab"],"source":"README.md"},{"id":"user","title":"Browser","subtitle":"localhost","tag":"WEB","flow":"request","x":40,"y":800,"description":"Opens the prod webapp through the ingress controller, and ExitZero on port 8001.","facts":["port-forward :8080","gitops-prod.localhost","localhost:8001"],"source":"README.md"},{"id":"repo","title":"Git repo","subtitle":"main branch","tag":"GIT","flow":"gitops","x":310,"y":100,"description":"The source of truth. CI builds from it and Argo CD syncs the cluster from it.","facts":["charts/ + envs/","k8s/api + logging/","infra/terraform"],"source":"argocd/applications/api.yaml"},{"id":"ci","title":"ci workflow","subtitle":"on apps/api/**","tag":"CI","flow":"build","x":310,"y":230,"description":"Builds the API image and fails on HIGH or CRITICAL CVEs. Pushes to ECR on main only.","facts":["docker build","Trivy scan","tag = git SHA","push on main only"],"source":".github/workflows/ci.yml"},{"id":"helm","title":"helm workflow","subtitle":"on charts/, envs/","tag":"HLM","flow":"build","x":560,"y":230,"description":"Lints and renders the chart for dev and prod. On main it packages the chart and pushes it to ECR.","facts":["helm lint --strict","dev + prod values","version 0.1.0-<sha>"],"source":".github/workflows/helm.yml"},{"id":"tfplan","title":"terraform-plan","subtitle":"on PRs to infra/","tag":"TF","flow":"infra","x":810,"y":230,"description":"Runs fmt, validate and plan on pull requests that touch infra/terraform.","facts":["fmt -check","plan -lock=false","read-only role"],"source":".github/workflows/terraform-plan.yml"},{"id":"oidc","title":"IAM OIDC roles","subtitle":"GitHub token to STS","tag":"IAM","flow":"creds","x":1100,"y":100,"description":"GitHub's OIDC token is exchanged for short-lived AWS credentials, so no AWS keys are stored in GitHub.","facts":["terraform role: main only","plan role: PRs only","ECR push + state bucket"],"source":"infra/terraform/bootstrap/github_oidc.tf"},{"id":"ecr","title":"ECR","subtitle":"api + charts/webapp","tag":"ECR","flow":"build","x":1100,"y":230,"description":"Holds the API image and the packaged chart. The kind cluster does not pull from here yet; the EKS deploy will.","facts":["immutable tags","scan on push","lifecycle policy"],"source":"infra/terraform/bootstrap/ecr.tf"},{"id":"s3","title":"S3 state","subtitle":"state + lockfile","tag":"S3","flow":"infra","x":1100,"y":380,"description":"Terraform state for bootstrap, network and eks, one key per stack, locked with an S3 lockfile.","facts":["one key per stack","use_lockfile","read by terraform-plan"],"source":"infra/terraform/network/main.tf"},{"id":"net","title":"VPC network","subtitle":"4 subnets \u00b7 1 NAT","tag":"NET","flow":"infra","x":1390,"y":140,"description":"Two public and two private subnets across ap-south-1a and 1b, an internet gateway, and one NAT gateway for private egress.","facts":["10.0.0.0/16","1 NAT gateway","kept between sessions"],"source":"infra/terraform/network/main.tf"},{"id":"eks","title":"EKS cluster","subtitle":"2 x t3.small nodes","tag":"EKS","flow":"infra","x":1390,"y":330,"description":"Control plane and a managed node group in the private subnets. Created for a lab session, then destroyed to save cost.","facts":["private subnets","public + private endpoint","created per session"],"source":"infra/
