name: helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "envs/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - "envs/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Helm lint
        run: helm lint charts/webapp --strict -f envs/${{ matrix.env }}/values.yaml

      - name: Helm template
        run: helm template webapp charts/webapp -f envs/${{ matrix.env }}/values.yaml > /dev/null

  push:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - run: helm package charts/webapp --version 0.1.0-${{ github.sha }}  --destination .
      - run: helm push webapp-0.1.0-${{ github.sha }}.tgz oci://${{ steps.ecr.outputs.registry }}/eks-gitops-platform/charts