<main id="main" class="console mood">
  <div class="container">
    <h1>What just broke?</h1>
    <p class="lead">Paste any error from your stack. ExitZero works out which tool it came from.</p>

    <div class="bot-stage" id="bot-stage">
    <form class="panel" id="ask-form">
      <label for="error">Error output</label>
      <textarea id="error" name="error" required minlength="3" maxlength="4000" placeholder="Error: ErrImagePull ... manifest unknown"></textarea>
      <div class="examples">
        <span>Try one:</span>
        <button type="button" class="example" data-text='Back-off pulling image "docker.elastic.co/elasticsearch/elasticsearch:9.5.6"&#10;Error: ErrImagePull: manifest unknown'>Image pull error</button>
        <button type="button" class="example" data-text="Error: Error acquiring the state lock&#10;ConditionalCheckFailedException: The conditional request failed&#10;Lock Info: ID: 3f1c2a">Terraform lock</button>
        <button type="button" class="example" data-text="Warning: Back-off restarting failed container filebeat in pod filebeat-beat-filebeat-2rm9b">Filebeat restarts</button>
        <button type="button" class="example" data-text="rpc error: code = Unknown desc = Get https://argocd-repo-server:8081: dial tcp 10.96.4.2:8081: i/o timeout">Argo CD timeout</button>
      </div>
      <div class="examples" id="recent-wrap" hidden>
        <span>Recent:</span>
        <span class="recent" id="recent"></span>
        <button type="button" class="link-btn" id="clear-recent">Clear</button>
      </div>
      <div class="actions">
        <button class="btn btn-primary btn-lg" id="ask-btn" type="submit"><i data-lucide="search"></i><span>Find the fix</span></button>
        <span class="hint">Ctrl + Enter to send</span>
      </div>
    </form>
    </div>

    <div id="error-box" class="error-box" role="alert" hidden>
      <i data-lucide="circle-alert"></i><span id="error-text"></span>
    </div>

    <section id="result" class="result" aria-live="polite" hidden></section>
  </div>
</main>
