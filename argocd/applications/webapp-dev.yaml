apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: webapp-dev
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/AfzalMansuri23/eks-gitops-platform.git
        targetRevision: main
        path: charts/webapp
        helm:
            valueFiles:
                - ../../envs/dev/values.yaml
    destination:
        server: https://kubernetes.default.svc
        namespace: gitops-dev
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true