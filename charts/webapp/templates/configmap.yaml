apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-content
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <h1>{{ .Values.page.title }}</h1>
    <p>Environment: {{ .Values.page.environment }}</p>
    <p>Release: {{ .Release.Name }} | Chart: {{ .Chart.Name }}-{{ .Chart.Version }}</p>